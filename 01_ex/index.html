<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 산책 - 나를 위한 여행지 추천</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">오늘의 산책</div>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h1>마음이 쉬어가는 곳을 찾아보세요</h1>
            <p>복잡한 일상을 벗어나 잠시 숨을 고를 수 있는 지역들을 추천합니다.</p>
        </section>

        <section class="region-selector" id="region-list">
            <!-- 자바스크립트에서 버튼을 생성합니다 -->
        </section>

        <section class="detail-container" id="detail-view">
            <div class="placeholder-text">위의 지역을 선택하면 상세 정보가 나타납니다.</div>
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>

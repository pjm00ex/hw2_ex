<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 추천 사이트 - 오렌지 & 코랄</title>
    <style>
        :root {
            --primary-color: #FF5A5F; /* Coral Red */
            --secondary-color: #FF8C00; /* Dark Orange */
            --background-color: #F7F7F7; /* Light Gray */
            --text-color: #333333;
            --light-text-color: #555555;
            --font-family: 'Arial', sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: var(--background-color);
            padding: 1rem 0;
            text-align: center;
        }

        nav {
            background-color: #FF6B6B; /* Slightly lighter coral for nav */
            padding: 0.7rem 0;
            text-align: center;
        }

        nav a {
            color: var(--background-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--secondary-color);
        }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .hero-section {
            text-align: center;
            padding: 4rem 0;
            background-color: #FFE0B2; /* Light orange tint */
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--secondary-color);
            color: var(--background-color);
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #FFA500; /* Brighter orange */
        }

        footer {
            text-align: center;
            padding: 1.5rem 0;
            background-color: var(--primary-color);
            color: var(--background-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Adventure Awaits!</h1>
    </header>
    <nav>
        <a href="#">홈</a>
        <a href="#">액티비티</a>
        <a href="#">이색 여행</a>
        <a href="#">커뮤니티</a>
    </nav>

    <div class="hero-section">
        <h2>잊지 못할 순간을 경험하세요!</h2>
        <p>짜릿한 모험부터 로맨틱한 휴가까지, 당신의 열정을 깨울 여행을 찾아보세요.</p>
        <a href="#" class="cta-button">지금 바로 떠나기</a>
    </div>

    <div class="container">
        <h3>추천 액티비티</h3>
        <p>
            스카이다이빙, 서핑, 스쿠버다이빙 등 당신의 심장을 뛰게 할 다양한 액티비티를
            전 세계 곳곳에서 경험해보세요.
        </p>
        <p>
            아름다운 노을을 배경으로 한 로맨틱한 디너 크루즈나, 활기찬 밤문화를 즐길 수 있는
            도시 여행도 준비되어 있습니다.
        </p>
    </div>

    <footer>
        <p>&copy; 2026 Adventure Awaits. All rights reserved.</p>
    </footer>
</body>
</html>

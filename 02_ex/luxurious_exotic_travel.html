<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 추천 사이트 - 고급스러운 & 이국적</title>
    <style>
        :root {
            --primary-color: #5D4037; /* Dark Brown/Coffee */
            --secondary-color: #FFD700; /* Gold */
            --accent-color: #8B0000; /* Dark Red/Burgundy */
            --background-color: #FFF8DC; /* Cornsilk */
            --text-color: #333333;
            --light-text-color: #555555;
            --font-family: 'Georgia', serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            padding: 1rem 0;
            text-align: center;
        }

        nav {
            background-color: #795548; /* Lighter brown for nav */
            padding: 0.7rem 0;
            text-align: center;
        }

        nav a {
            color: var(--secondary-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .hero-section {
            text-align: center;
            padding: 4rem 0;
            background-color: #FDF5E6; /* Lighter cream tint */
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--background-color);
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #A52A2A; /* Darker red */
        }

        footer {
            text-align: center;
            padding: 1.5rem 0;
            background-color: var(--primary-color);
            color: var(--secondary-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Exotic Escapes</h1>
    </header>
    <nav>
        <a href="#">홈</a>
        <a href="#">럭셔리</a>
        <a href="#">이국적인</a>
        <a href="#">컨시어지</a>
    </nav>

    <div class="hero-section">
        <h2>당신만을 위한 특별한 여정</h2>
        <p>세상 어디에서도 경험할 수 없는, 럭셔리하고 이국적인 여행을 떠나보세요.</p>
        <a href="#" class="cta-button">프리미엄 여행 탐색</a>
    </div>

    <div class="container">
        <h3>엄선된 럭셔리 경험</h3>
        <p>
            사막의 오아시스, 고대 문명의 흔적, 최고급 리조트에서의 휴식 등
            잊지 못할 순간을 선사할 특별한 여행지를 소개합니다.
        </p>
        <p>
            고급스러운 색상 조합과 우아한 디자인으로, 당신의 여행이 시작되는 순간부터
            특별함을 느낄 수 있도록 도와드립니다.
        </p>
    </div>

    <footer>
        <p>&copy; 2026 Exotic Escapes. All rights reserved.</p>
    </footer>
</body>
</html>

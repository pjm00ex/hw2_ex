<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 추천 사이트 - 모던 & 미니멀</title>
    <style>
        :root {
            --primary-color: #333333; /* Charcoal Gray */
            --secondary-color: #A0A0A0; /* Light Gray */
            --accent-color: #6A5ACD; /* Slate Blue */
            --background-color: #F8F8F8; /* Off-White */
            --text-color: #333333;
            --light-text-color: #555555;
            --font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: var(--background-color);
            padding: 1rem 0;
            text-align: center;
        }

        nav {
            background-color: #444444; /* Slightly lighter gray for nav */
            padding: 0.7rem 0;
            text-align: center;
        }

        nav a {
            color: var(--background-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .hero-section {
            text-align: center;
            padding: 4rem 0;
            background-color: #EFEFEF; /* Lighter gray tint */
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--background-color);
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #7B68EE; /* Slightly brighter slate blue */
        }

        footer {
            text-align: center;
            padding: 1.5rem 0;
            background-color: var(--primary-color);
            color: var(--background-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>The Minimalist Journey</h1>
    </header>
    <nav>
        <a href="#">홈</a>
        <a href="#">큐레이션</a>
        <a href="#">프리미엄</a>
        <a href="#">문의</a>
    </nav>

    <div class="hero-section">
        <h2>단순함 속의 아름다움</h2>
        <p>불필요한 것을 덜어내고, 여행의 본질에 집중하세요.</p>
        <a href="#" class="cta-button">나만의 여정 시작하기</a>
    </div>

    <div class="container">
        <h3>엄선된 여행지</h3>
        <p>
            복잡함 없이 오직 당신의 경험에만 집중할 수 있는,
            세심하게 선별된 여행지를 소개합니다.
        </p>
        <p>
            모던하고 미니멀한 디자인으로, 여행 정보가 더욱 명확하게 전달됩니다.
            최고의 순간을 위한 최적의 선택을 도와드립니다.
        </p>
    </div>

    <footer>
        <p>&copy; 2026 The Minimalist Journey. All rights reserved.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 추천 사이트 - 활기찬 & 젊음</title>
    <style>
        :root {
            --primary-color: #FF6B6B; /* Bright Coral Red */
            --secondary-color: #4ECDC4; /* Turquoise */
            --accent-color: #FFD93D; /* Sunny Yellow */
            --background-color: #FFFFFF; /* White */
            --text-color: #333333;
            --light-text-color: #555555;
            --font-family: 'Poppins', sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: var(--background-color);
            padding: 1rem 0;
            text-align: center;
        }

        nav {
            background-color: #FF8E8E; /* Lighter coral for nav */
            padding: 0.7rem 0;
            text-align: center;
        }

        nav a {
            color: var(--background-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--secondary-color);
        }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .hero-section {
            text-align: center;
            padding: 4rem 0;
            background-color: #E0FFFF; /* Light turquoise tint */
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--primary-color);
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #FFEA61; /* Brighter yellow */
        }

        footer {
            text-align: center;
            padding: 1.5rem 0;
            background-color: var(--primary-color);
            color: var(--background-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Vibe Travel</h1>
    </header>
    <nav>
        <a href="#">홈</a>
        <a href="#">핫플레이스</a>
        <a href="#">액티비티</a>
        <a href="#">친구와 함께</a>
    </nav>

    <div class="hero-section">
        <h2>당신의 젊음을 위한 여행!</h2>
        <p>새로운 경험과 활기찬 에너지가 가득한 여행을 지금 바로 떠나보세요.</p>
        <a href="#" class="cta-button">나만의 Vibe 찾기</a>
    </div>

    <div class="container">
        <h3>트렌디한 여행지</h3>
        <p>
            SNS에서 핫한 여행지, 친구들과 함께 즐길 수 있는 액티비티,
            잊지 못할 추억을 만들 수 있는 특별한 장소를 소개합니다.
        </p>
        <p>
            생동감 넘치는 색상과 직관적인 디자인으로, 당신의 여행 계획을
            더욱 쉽고 즐겁게 만들어 드립니다.
        </p>
    </div>

    <footer>
        <p>&copy; 2026 Vibe Travel. All rights reserved.</p>
    </footer>
</body>
</html>

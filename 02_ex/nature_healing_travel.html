<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 추천 사이트 - 그린 & 어스톤</title>
    <style>
        :root {
            --primary-color: #2D5A27; /* Forest Green */
            --secondary-color: #F5F5DC; /* Beige */
            --accent-color: #E67E22; /* Soft Orange */
            --background-color: #FDFDF0; /* Lighter beige/cream */
            --text-color: #333333;
            --light-text-color: #555555;
            --font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            padding: 1rem 0;
            text-align: center;
        }

        nav {
            background-color: #3A6B35; /* Slightly lighter green for nav */
            padding: 0.7rem 0;
            text-align: center;
        }

        nav a {
            color: var(--secondary-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .hero-section {
            text-align: center;
            padding: 4rem 0;
            background-color: var(--secondary-color);
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--background-color);
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #F08C30; /* Slightly brighter orange */
        }

        footer {
            text-align: center;
            padding: 1.5rem 0;
            background-color: var(--primary-color);
            color: var(--secondary-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Green Journey</h1>
    </header>
    <nav>
        <a href="#">홈</a>
        <a href="#">자연 속 힐링</a>
        <a href="#">친환경 여행</a>
        <a href="#">커뮤니티</a>
    </nav>

    <div class="hero-section">
        <h2>자연과 함께하는 진정한 휴식</h2>
        <p>지친 일상에서 벗어나 자연의 품에서 에너지를 충전하세요.</p>
        <a href="#" class="cta-button">나만의 힐링 여행 찾기</a>
    </div>

    <div class="container">
        <h3>추천 힐링 스팟</h3>
        <p>
            고요한 숲길, 청량한 계곡, 드넓은 초원 등 몸과 마음을 정화시켜줄
            다양한 힐링 여행지를 소개합니다.
        </p>
        <p>
            지속 가능한 여행을 지향하며, 지역 사회와 환경에 긍정적인 영향을 주는
            여행 경험을 제공합니다.
        </p>
    </div>

    <footer>
        <p>&copy; 2026 Green Journey. All rights reserved.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Travel Palette | 당신을 위한 여행</title>
    <link rel="stylesheet" href="ex.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">TravelPalette</div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>어디로 떠나고 싶으신가요?</h1>
            <p>당신의 취향을 분석하여 최적의 여행지를 추천해 드립니다.</p>
        </section>

        <div class="card-grid">
            <article class="card">
                <div class="card-img"></div>
                <h3>제주, 조용한 숲길</h3>
                <p>바쁜 일상을 벗어나 숲의 향기를 느껴보세요.</p>
                <button class="btn">자세히 보기</button>
            </article>
            </div>
    </main>

</body>
</html>
